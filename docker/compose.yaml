services:
  mysql:
    image: mysql:8.4
    container_name: edmcp-demo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: demoroot
      MYSQL_DATABASE: edmcp_demo
      MYSQL_USER: edmcp_ro
      MYSQL_PASSWORD: demoro
    ports:
      - "127.0.0.1:3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdemoroot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mcp-http:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: edmcp-mcp-http
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MCP_TRANSPORT: streamable_http
      MCP_CONTAINER: mysql
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8080"
      MCP_PATH: /mcp
      MCP_ALLOWED_ORIGINS: "http://127.0.0.1:3000"
      MCP_MAX_REQUEST_BODY_BYTES: "1048576"
      MCP_MAX_INFLIGHT_REQUESTS: "32"
      MCP_CALLER_ID: demo-compose-http-client
      MCP_POLICY_PROFILE: demo_readonly
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: edmcp_ro
      MYSQL_PASSWORD: demoro
      MYSQL_DATABASE: edmcp_demo
      MYSQL_QUERY_TIMEOUT_MS: "5000"
      AUDIT_DB_PATH: /var/edmcp/audit/http-audit.sqlite3
    volumes:
      - edmcp_audit:/var/edmcp/audit
    ports:
      - "127.0.0.1:18080:8080"
    command: ["python", "-m", "enterprise_data_mcp.hosts.streamable_http"]

  mcp-sse:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: edmcp-mcp-sse
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MCP_TRANSPORT: sse
      MCP_CONTAINER: mysql
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8081"
      MCP_PATH: /sse
      MCP_ALLOWED_ORIGINS: "http://127.0.0.1:3000"
      MCP_MAX_REQUEST_BODY_BYTES: "1048576"
      MCP_MAX_INFLIGHT_REQUESTS: "32"
      MCP_LEGACY_MAX_SESSIONS: "16"
      MCP_LEGACY_SESSION_IDLE_TIMEOUT_SECONDS: "300"
      MCP_CALLER_ID: demo-compose-sse-client
      MCP_POLICY_PROFILE: demo_readonly
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: edmcp_ro
      MYSQL_PASSWORD: demoro
      MYSQL_DATABASE: edmcp_demo
      MYSQL_QUERY_TIMEOUT_MS: "5000"
      AUDIT_DB_PATH: /var/edmcp/audit/sse-audit.sqlite3
    volumes:
      - edmcp_audit:/var/edmcp/audit
    ports:
      - "127.0.0.1:18081:8081"
    command: ["python", "-m", "enterprise_data_mcp.hosts.sse"]

volumes:
  edmcp_audit:
